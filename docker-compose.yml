services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renewcred-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: renewcred-admin
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  public-frontend:
    build:
      context: ./public-frontend
      dockerfile: Dockerfile
    container_name: renewcred-public
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
